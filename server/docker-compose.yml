services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: eigent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eigent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eigent_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d eigent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        database_url: postgresql://postgres:${POSTGRES_PASSWORD:-123456}@postgres:5432/eigent
    container_name: eigent_api
    restart: unless-stopped
    ports:
      - "3001:5678"
    env_file:
      - path: .env
        required: false
    environment:
      # App reads lowercase database_url (not DATABASE_URL).
      - database_url=postgresql://postgres:${POSTGRES_PASSWORD:-123456}@postgres:5432/eigent
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-123456}@postgres:5432/eigent
      - secret_key=${SECRET_KEY:-change-me-in-production}
      - url_prefix=/api
      - debug=false
      - ENVIRONMENT=production
      - DEBUG=false
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eigent_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5678/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  eigent_network:
    driver: bridge
